# Source for terminal.svg and terminal-static.svg.
# Generate locally with Node 22+:
#   npx svg-terminal generate --config terminal.yml --output terminal.svg --strict
#   npx svg-terminal generate --config terminal.yml --output terminal-static.svg --static --strict

theme: oxocarbon

window:
  title: "timothee@github: ~"
  width: 1000
  autoHeight: true
  minHeight: 390
  maxHeight: 560
  style: minimal
  borderRadius: 10

terminal:
  prompt: "timothee@dev:~$ "
  fontFamily: "JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
  fontSize: 16
  lineHeight: 1.5
  padding: 28

effects:
  textGlow: false
  scanlines: false
  vignette: false
  shadow: true

animation:
  loop: true
  defaultTypingDuration: 900
  outputLineStagger: 110
  commandOutputPause: 500
  outputEndPause: 900
  defaultSequencePause: 650

accessibility:
  describe: true

accessibilityLabel: "Animated terminal introduction for Timothée, a Computer Science student at the University of Surrey"
maxDuration: 30

blocks:
  - block: neofetch
    config:
      username: timothee
      hostname: github
      role: Computer Science / Software Engineering
      languages: Go, Python, Java, C++, TypeScript

  - block: custom
    config:
      command: cat interests.txt
      lines:
        - "[[fg:cyan]]software engineering[[/fg]] / systems / security / applied AI"

  - block: custom
    config:
      command: ls projects/
      lines:
        - "golang-text-editor/"
        - "smart-campus-energy-anomaly-dashboard/"
        - "trading-bot/"

  - block: custom
    config:
      command: "printf 'status: %s\\n' learning"
      lines:
        - "building practical software, one iteration at a time"
