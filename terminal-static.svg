<svg width="1000" height="550" viewBox="0 0 1000 550" xmlns="http://www.w3.org/2000/svg"
  role="img" aria-label="Animated terminal introduction for Timothée, a Computer Science student at the University of Surrey">
  <title>Animated terminal introduction for Timothée, a Computer Science student at the University of Surrey</title>
  <desc>timothee@dev:~$ neofetch --ascii_distro github
timothee@github
OS:        TerminalOS v1.0
Shell:     bash 5.2
Uptime:    a long time
Role:      Computer Science / Software Engineering
Location:  localhost
Languages: Go, Python, Java, C++, TypeScript
Editor:    neovim

● ● ● ● ● ● ● ●
timothee@dev:~$ cat interests.txt
software engineering / systems / security / applied AI
timothee@dev:~$ ls projects/
golang-text-editor/
smart-campus-energy-anomaly-dashboard/
trading-bot/
timothee@dev:~$ printf &apos;status: %s\n&apos; learning
building practical software, one iteration at a time</desc>
  <style>.tt { font-family: JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; white-space: pre; }</style>
  <defs>
    
    
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.55"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="terminalViewport">
      <rect x="0" y="0" width="1000" height="550"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    
    <rect x="0" y="0" width="1000" height="550"
          rx="10" ry="10"
          fill="#161616"/>
    
    <rect x="0" y="0" width="1000"
          height="550" fill="#161616"/>
    <g clip-path="url(#terminalViewport)">
      <g transform="translate(28, 14)">
        
      <text class="tt" y="0" fill="#f2f4f8">
        timothee@dev:~$ neofetch --ascii_distro github
      </text>
      <text class="tt" y="24">
